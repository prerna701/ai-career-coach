services:
  postgres:
    image: postgres:16-alpine
    container_name: aicareercoach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aicareercoach
    ports:
      - "5434:5432"
    volumes:
      - aicareercoach_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aicareercoach"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aicareercoach_pgdata:
