services:
  postgres:
    image: postgres:16-alpine
    container_name: aicareercoach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aicareercoach
    ports:
      - "5434:5432"
    volumes:
      - aicareercoach_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aicareercoach"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: node:20-alpine
    container_name: aicareercoach-migrate
    working_dir: /app
    volumes:
      - .:/app
      - aicareercoach_migrate_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aicareercoach?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm install prisma@6.14.0 @prisma/client@6.14.0 bcryptjs dotenv --no-save && npx prisma migrate deploy && npx prisma db seed"
    restart: "no"

volumes:
  aicareercoach_pgdata:
  aicareercoach_migrate_node_modules:
